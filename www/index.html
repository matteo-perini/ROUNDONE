<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoundOne - Accedi o Registrati</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="LOGO-APP.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RoundOne">
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white overflow-x-hidden relative">

    <!-- HEADER MINIMALE -->
    <header class="px-6 py-4 flex justify-between items-center border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md">
        <h1 class="text-base font-black tracking-tight text-white flex items-center gap-2">
            🥊 <span class="bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">RoundOne</span>
        </h1>
    </header>

    <!-- MAIN CONTAINER CENTRATO -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6">

        <!-- BRANDING INTRODUTTIVO -->
        <div class="text-center mb-6 space-y-1">
            <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-white">Gestione e Programmi</h2>
            <p class="text-xs sm:text-sm text-slate-400">Accedi alla tua area riservata o unisciti alla tua palestra.</p>
        </div>

        <!-- SEZIONE AUTH (CARD) -->
        <section id="auth-section" class="w-full max-w-sm sm:max-w-md bg-white text-slate-900 p-5 sm:p-6 rounded-3xl shadow-2xl border border-indigo-100">
            <div class="flex border-b border-slate-100 mb-4">
                <button id="tab-login" class="w-1/2 pb-2.5 font-bold text-center border-b-2 border-indigo-600 text-indigo-950 transition text-xs sm:text-sm">Accedi</button>
                <button id="tab-register" class="w-1/2 pb-2.5 font-semibold text-center text-slate-400 border-b-2 border-transparent transition text-xs sm:text-sm hover:text-slate-600">Registrati</button>
            </div>

            <!-- FORM ACCEDI -->
            <form id="login-form" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-indigo-950 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full px-3.5 py-2.5 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-indigo-950 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-3.5 py-2.5 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-xs shadow-md mt-2">Accedi</button>
            </form>

            <!-- FORM REGISTRAZIONE -->
            <form id="register-form" class="space-y-3 hidden">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-indigo-950 mb-0.5">Nome e Cognome</label>
                    <input type="text" id="reg-name" required class="w-full px-3 py-2 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-indigo-950 mb-0.5">Email</label>
                    <input type="email" id="reg-email" required class="w-full px-3 py-2 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-indigo-950 mb-0.5">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-3 py-2 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-indigo-950 mb-0.5">Tipo di Account</label>
                    <select id="reg-role" class="w-full px-3 py-2 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                        <option value="athlete">Atleta (Iscriviti a una palestra)</option>
                        <option value="admin">Coach / Amministratore (Crea palestra)</option>
                    </select>
                </div>

                <div id="invite-code-container">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-indigo-950 mb-0.5">Codice Invito Palestra</label>
                    <input type="text" id="reg-invite-code" placeholder="Es. GYM-8492" class="w-full px-3 py-2 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none uppercase text-xs transition">
                </div>

                <div id="gym-create-container" class="hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-indigo-950 mb-0.5">Nome della Tua Palestra</label>
                    <input type="text" id="reg-gym-name" placeholder="Es. Leoni di San Marco" class="w-full px-3 py-2 bg-indigo-50/40 border border-indigo-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none text-xs transition">
                </div>

                <div class="pt-2 pb-1 space-y-1.5 border-t border-slate-100 mt-1">
                    <label class="flex items-start gap-2 text-[10px] text-slate-600 leading-tight cursor-pointer">
                        <input type="checkbox" required class="mt-0.5 rounded border-indigo-300 text-indigo-600 focus:ring-indigo-500">
                        <span>Accetto le <a href="note-legali.html" target="_blank" class="font-bold text-indigo-600 underline">Note Legali e Termini d'Uso</a>.</span>
                    </label>
                    <label class="flex items-start gap-2 text-[10px] text-slate-600 leading-tight cursor-pointer">
                        <input type="checkbox" required class="mt-0.5 rounded border-indigo-300 text-indigo-600 focus:ring-indigo-500">
                        <span>Acconsento alla <a href="policy.html" target="_blank" class="font-bold text-indigo-600 underline">Privacy Policy</a>.</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-xs shadow-md mt-1">Crea Account</button>
            </form>
        </section>
    </main>

    <!-- MODAL CUSTOM NOTIFICHE -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white text-slate-900 w-full max-w-sm rounded-2xl shadow-2xl border border-indigo-100 p-6 space-y-4 text-center">
            <div class="text-3xl">✨</div>
            <h4 id="custom-alert-title" class="font-black text-base text-indigo-950">Notifica</h4>
            <p id="custom-alert-message" class="text-xs text-slate-600 leading-relaxed"></p>
            <button type="button" id="custom-alert-ok" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-xs shadow-md">Capito</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center py-3 text-[11px] text-slate-500 font-medium border-t border-slate-800/80 bg-slate-900/50 backdrop-blur-md">
        RoundOne &copy; 2026
    </footer>

    <!-- SCRIPT JAVASCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5xFMM-kKy2-pYzcTk3MiFmXCTCe4EXEA",
            authDomain: "app-palestra-b0b9d.firebaseapp.com",
            projectId: "app-palestra-b0b9d",
            storageBucket: "app-palestra-b0b9d.firebasestorage.app",
            messagingSenderId: "412455135240",
            appId: "1:412455135240:web:d53bd1a83a400d5e6809bd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let alertCallback = null;
        function showAlert(message, title = "Notifica", callback = null) {
            document.getElementById('custom-alert-title').textContent = title;
            document.getElementById('custom-alert-message').textContent = message;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
            alertCallback = callback;
        }

        document.getElementById('custom-alert-ok').addEventListener('click', () => {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            if (alertCallback) { alertCallback(); alertCallback = null; }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) { await checkUserRoleAndRedirect(user.uid); }
        });

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const regRole = document.getElementById('reg-role');
        const inviteCodeContainer = document.getElementById('invite-code-container');
        const gymCreateContainer = document.getElementById('gym-create-container');

        tabLogin.addEventListener('click', () => {
            tabLogin.className = "w-1/2 pb-2.5 font-bold text-center border-b-2 border-indigo-600 text-indigo-950 transition text-xs sm:text-sm";
            tabRegister.className = "w-1/2 pb-2.5 font-semibold text-center text-slate-400 border-b-2 border-transparent transition text-xs sm:text-sm hover:text-slate-600";
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.className = "w-1/2 pb-2.5 font-bold text-center border-b-2 border-indigo-600 text-indigo-950 transition text-xs sm:text-sm";
            tabLogin.className = "w-1/2 pb-2.5 font-semibold text-center text-slate-400 border-b-2 border-transparent transition text-xs sm:text-sm hover:text-slate-600";
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        regRole.addEventListener('change', (e) => {
            if (e.target.value === 'admin') {
                inviteCodeContainer.classList.add('hidden');
                gymCreateContainer.classList.remove('hidden');
            } else {
                inviteCodeContainer.classList.remove('hidden');
                gymCreateContainer.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                showAlert("Login avvenuto con successo!", "Benvenuto", async () => {
                    await checkUserRoleAndRedirect(userCredential.user.uid);
                });
            } catch (error) {
                showAlert("Errore durante il login: " + error.message, "Errore");
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = regRole.value;

            try {
                let gymId = "";
                let gymName = "";
                let inviteCode = "";

                if (role === 'admin') {
                    gymName = document.getElementById('reg-gym-name').value;
                    if (!gymName) { showAlert("Inserisci il nome della palestra", "Attenzione"); return; }
                    
                    gymId = "gym_" + Date.now();
                    inviteCode = "GYM-" + Math.floor(1000 + Math.random() * 9000);

                    await setDoc(doc(db, "gyms", gymId), {
                        name: gymName,
                        inviteCode: inviteCode,
                        createdAt: new Date()
                    });
                } else {
                    inviteCode = document.getElementById('reg-invite-code').value.trim().toUpperCase();
                    if (!inviteCode) { showAlert("Inserisci il codice invito della palestra", "Attenzione"); return; }

                    const gymsQuery = query(collection(db, "gyms"), where("inviteCode", "==", inviteCode));
                    const querySnapshot = await getDocs(gymsQuery);

                    if (querySnapshot.empty) {
                        showAlert("Codice invito non valido o palestra non trovata.", "Errore");
                        return;
                    }

                    querySnapshot.forEach((docSnap) => {
                        gymId = docSnap.id;
                        gymName = docSnap.data().name;
                    });
                }

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                await setDoc(doc(db, "users", uid), {
                    name: name,
                    email: email,
                    role: role,
                    gymId: gymId,
                    gymName: gymName
                });

                showAlert("Registrazione completata con successo!", "Account Creato", async () => {
                    await checkUserRoleAndRedirect(uid);
                });

            } catch (error) {
                showAlert("Errore di registrazione: " + error.message, "Errore");
            }
        });

        async function checkUserRoleAndRedirect(uid) {
            try {
                const userDoc = await getDoc(doc(db, "users", uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'admin') {
                        window.location.replace('admin.html');
                    } else {
                        window.location.replace('athlete.html');
                    }
                } else {
                    showAlert("Profilo utente non trovato nel database.", "Errore");
                }
            } catch (error) {
                console.error("Errore nel recupero del ruolo:", error);
            }
        }
    </script>
</body>
</html>
