<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LionFit Default Logo</title>
  <desc id="desc">Default LionFit brand mark used when a gym has not uploaded a custom logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#162332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#d8b96d"/>
      <stop offset="1" stop-color="#22df7b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
  <path d="M164 133h48v178h98v44H164V133zm126 0h150v44h-102v44h86v42h-86v48h106v44H290V133z" fill="#f7fbff"/>
  <path d="M152 395h206" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <text x="256" y="431" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-style="italic" font-weight="900" fill="url(#accent)">LIONFIT</text>
</svg>
