<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Palestra</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50/70 text-slate-900 min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="bg-slate-900 text-white border-b border-slate-800 px-4 sm:px-6 py-3.5 sm:py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <!-- BOTTONE PER TORNARE INDIETRO -->
            <button id="btn-back" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow-xs">
                &larr; Indietro
            </button>
            <h1 class="text-base sm:text-xl font-extrabold tracking-tight text-white flex items-center gap-1.5">💬 Chat della Palestra</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="user-display" class="text-xs sm:text-sm font-medium text-slate-300 hidden sm:inline"></span>
            <button id="btn-logout" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold hover:bg-rose-600/30 transition shadow-xs">Esci</button>
        </div>
    </header>

    <!-- MAIN CONTAINER CHAT -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-3 sm:p-6 flex flex-col h-[calc(100vh-120px)]">
        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-indigo-100 flex flex-col flex-grow overflow-hidden">
            <div class="border-b border-indigo-100 pb-3 mb-3">
                <h3 class="text-base font-black text-indigo-950">Canale Ufficiale Team</h3>
                <p class="text-xs text-slate-500">Chiedi informazioni sulle schede o scrivi al coach.</p>
            </div>

            <!-- Box Messaggi -->
            <div id="chat-messages" class="flex-grow overflow-y-auto space-y-3 pr-2 border border-indigo-100 p-3 rounded-xl bg-slate-50/50 mb-3 text-xs sm:text-sm">
                <p class="text-xs text-slate-400 italic text-center py-6">Caricamento messaggi in corso...</p>
            </div>

            <!-- Form Invio -->
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." required class="flex-grow px-4 py-2.5 bg-indigo-50/50 border border-indigo-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition shadow-md">Invia</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-xs text-indigo-900/60 font-medium border-t border-indigo-100 bg-white/50">
        Applicazione Palestra &copy; 2026
    </footer>

    <!-- LOGICA FIREBASE CHAT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5xFMM-kKy2-pYzcTk3MiFmXCTCe4EXEA",
            authDomain: "app-palestra-b0b9d.firebaseapp.com",
            projectId: "app-palestra-b0b9d",
            storageBucket: "app-palestra-b0b9d.firebasestorage.app",
            messagingSenderId: "412455135240",
            appId: "1:412455135240:web:d53bd1a83a400d5e6809bd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userDisplay = document.getElementById('user-display');
        const btnLogout = document.getElementById('btn-logout');
        const btnBack = document.getElementById('btn-back');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        let currentGymId = null;
        let currentUserId = null;
        let currentUserName = "";
        let currentUserRole = "";
        let userRoleType = "";

        btnLogout.addEventListener('click', async () => {
            try { await signOut(auth); } catch (e) {} finally { window.location.replace('index.html'); }
        });

        // Torna alla pagina corretta (Atleta o Coach) in base al ruolo
        btnBack.addEventListener('click', () => {
            if (userRoleType === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'athlete.html';
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('index.html');
                return;
            }

            currentUserId = user.uid;

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists()) {
                    alert("Utente non trovato.");
                    window.location.replace('index.html');
                    return;
                }

                const userData = userDoc.data();
                currentGymId = userData.gymId;
                currentUserName = userData.name;
                userRoleType = userData.role; // 'admin' o 'athlete'
                currentUserRole = userData.role === 'admin' ? 'COACH' : 'ATLETA';

                userDisplay.textContent = `${userData.name} (${currentUserRole})`;

                initChat();

            } catch (error) {
                console.error("Errore caricamento chat:", error);
                chatMessages.innerHTML = '<p class="text-xs text-rose-500 text-center py-4">Errore nel caricamento della chat.</p>';
            }
        });

        function initChat() {
            if (!currentGymId) return;

            const chatRef = collection(db, "gyms", currentGymId, "chat");
            const q = query(chatRef, orderBy("createdAt", "asc"));

            onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = '';
                if (snapshot.empty) {
                    chatMessages.innerHTML = '<p class="text-xs text-slate-400 italic text-center py-6">Nessun messaggio nella chat. Scrivi il primo!</p>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    const isMe = msg.senderId === currentUserId;
                    const roleBadge = msg.senderRole === 'admin' 
                        ? '<span class="bg-indigo-900 text-white text-[9px] px-1.5 py-0.5 rounded font-bold ml-1">COACH</span>' 
                        : '<span class="bg-slate-200 text-slate-700 text-[9px] px-1.5 py-0.5 rounded font-bold ml-1">ATLETA</span>';

                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    
                    div.innerHTML = `
                        <div class="flex items-center gap-1 mb-1">
                            <span class="font-bold text-xs text-slate-700">${msg.senderName}</span>
                            ${roleBadge}
                        </div>
                        <div class="max-w-[85%] px-3.5 py-2 rounded-xl text-xs sm:text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none shadow-xs' : 'bg-slate-200 text-slate-900 rounded-bl-none shadow-xs'}">
                            ${escapeHtml(msg.text)}
                        </div>
                    `;
                    chatMessages.appendChild(div);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const text = chatInput.value.trim();
                if (!text) return;

                try {
                    await addDoc(chatRef, {
                        senderId: currentUserId,
                        senderName: currentUserName,
                        senderRole: userRoleType,
                        text: text,
                        createdAt: serverTimestamp()
                    });
                    chatInput.value = '';
                } catch (err) {
                    alert("Errore invio messaggio: " + err.message);
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
